{{define "content"}}
<form class="auth-card" method="POST" action="{{authURL "/force-password-change"}}">
  {{template "logo" .}}
  <h1 class="auth-title">{{.ThemeTitle}}</h1>
  <p class="auth-text-muted">An administrator has requested that you change your password.</p>
  {{if .Error}}
  <div class="auth-error" role="alert">{{.Error}}</div>
  {{end}}
  {{ .csrfField }}
  <input type="hidden" name="user_id" value="{{.UserID}}" />
  <input type="hidden" name="redirect_uri" value="{{.RedirectURI}}" />
  <input type="hidden" name="state" value="{{.State}}" />
  <input type="hidden" name="client_id" value="{{.ClientID}}" />
  <input type="hidden" name="scope" value="{{.Scope}}" />
  <input type="hidden" name="nonce" value="{{.Nonce}}" />
  <input type="hidden" name="code_challenge" value="{{.CodeChallenge}}" />
  <input type="hidden" name="code_challenge_method" value="{{.CodeChallengeMethod}}" />
  <div class="auth-field">
    <label class="auth-label" for="password">New Password</label>
    <input class="auth-input" type="password" id="password" name="password" required autocomplete="new-password" />
  </div>
  <div class="auth-field">
    <label class="auth-label" for="confirm_password">Confirm Password</label>
    <input class="auth-input" type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" />
  </div>
  <button class="auth-btn" type="submit">Change password</button>
</form>
{{end}}
