<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="same-origin" />
  <!--
    This page is served as a static file by Caddy's file_server, sitting in
    front of an autentico instance, with /oauth2/* and /account/api/* below
    reverse-proxied to that instance unmodified — see Caddyfile.sample. Auth
    itself is handled by /oauth2/static/oidc.js (the shared PKCE client
    autentico serves for every account theme), which dashboard.js imports as
    an ES module and configures to run its own OAuth PKCE login directly
    against autentico (Caddy is not part of that flow). If
    AUTENTICO_APP_OAUTH_PATH is customized away from the default "/oauth2",
    update the paths in this file and dashboard.js to match.
  -->
  <link rel="icon" type="image/svg+xml" href="/oauth2/static/logo.svg" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="/oauth2/static/auth.css" />
  <link rel="stylesheet" href="/oauth2/static/theme.css" />
  <!-- Line Awesome: lets an application's "icon" be a class list like authcrunch's
       own `icon "las la-user"` UI-link syntax, instead of an image URL. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/line-awesome@1.3.0/dist/line-awesome/css/line-awesome.min.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>
  <main class="auth-page">
    <div class="dash-shell" id="dash-root">
      <header class="dash-header">
        <div class="dash-brand">
          <div class="logo"><img src="/oauth2/static/logo.svg" alt="" width="128" height="128" /></div>
          <div>
            <h1 class="auth-title">Dashboard</h1>
            <p class="dash-welcome" id="dash-welcome">&nbsp;</p>
          </div>
        </div>
        <div class="dash-gear" id="dash-gear">
          <button type="button" class="dash-gear-btn" id="gear-btn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
          <div class="dash-gear-menu" id="gear-menu" role="menu">
            <button type="button" class="dash-gear-item" id="menu-password" role="menuitem">Change Password</button>
            <a class="dash-gear-item" id="menu-logout" role="menuitem" href="/oauth2/logout">Logout</a>
            <button type="button" class="dash-gear-item dash-gear-item-danger" id="menu-delete" role="menuitem">Delete Account</button>
          </div>
        </div>
      </header>

      <div class="auth-info dash-banner" id="dash-banner" role="status" hidden></div>
      <div class="auth-error dash-banner" id="dash-error" role="alert" hidden></div>

      <section class="dash-apps">
        <h2 class="dash-section-title" id="dash-apps-title">&gt; Applications</h2>
        <div class="dash-apps-container" id="apps-list" aria-live="polite">
          <p class="auth-text-muted">Loading&hellip;</p>
        </div>
      </section>
    </div>
  </main>

  <div class="dash-modal-backdrop" id="password-modal" hidden>
    <div class="dash-modal" role="dialog" aria-modal="true" aria-labelledby="password-modal-title">
      <h2 id="password-modal-title" class="dash-modal-title">Change Password</h2>
      <form id="password-form">
        <div class="auth-field">
          <label class="auth-label" for="current_password">Current Password</label>
          <input class="auth-input" type="password" id="current_password" required autocomplete="current-password" />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="new_password">New Password</label>
          <input class="auth-input" type="password" id="new_password" required autocomplete="new-password" />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="confirm_new_password">Confirm New Password</label>
          <input class="auth-input" type="password" id="confirm_new_password" required autocomplete="new-password" />
        </div>
        <div class="auth-error" id="password-error" role="alert" hidden></div>
        <div class="dash-modal-actions">
          <button type="button" class="auth-btn-secondary" data-modal-close>Cancel</button>
          <button type="submit" class="auth-btn">Update</button>
        </div>
      </form>
    </div>
  </div>

  <div class="dash-modal-backdrop" id="delete-modal" hidden>
    <div class="dash-modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <h2 id="delete-modal-title" class="dash-modal-title">Delete Account</h2>
      <p class="auth-text-muted">This will permanently delete your account and all associated data. This cannot be undone.</p>
      <div class="auth-error" id="delete-error" role="alert" hidden></div>
      <div class="dash-modal-actions">
        <button type="button" class="auth-btn-secondary" data-modal-close>Cancel</button>
        <button type="button" class="auth-btn dash-btn-danger" id="delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>

</html>
